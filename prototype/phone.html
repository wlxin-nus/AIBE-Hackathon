<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Common Climate · Your comfort</title><link rel="stylesheet" href="/style.css"></head>
<body data-view="phone"><main class="phone-page"><header class="phone-head"><strong>Common Climate</strong><span id="connection">Not sharing</span></header>
<p class="eyebrow">PERSONAL COMFORT &nbsp; / &nbsp; CHECK-IN</p><h1>Your place<br>on the floor.</h1>
<form id="join-form" class="phone-panel"><div class="field-pair"><label>Room code<input id="room" inputmode="numeric" maxlength="6" required></label><label>Alias<input id="alias" placeholder="Your name or alias" maxlength="32" required></label></div>
<h2>Your comfort range</h2><div class="temps"><label>Min °C<input id="minimum" type="number" min="18" max="30" step="0.5" value="23" required></label><label>Preferred °C<input id="preferred" type="number" min="18" max="30" step="0.5" value="24.5" required></label><label>Max °C<input id="maximum" type="number" min="18" max="30" step="0.5" value="26" required></label></div>
<label class="consent"><input id="consent" type="checkbox" required>Share my alias, comfort range and chosen location with this room.</label><button id="join">Join room</button></form>
<section class="phone-panel floor-panel"><p class="eyebrow">LOCATION &nbsp; / &nbsp; MANUAL</p><h2>Tap your place</h2><p>Choose a spot inside the outline. Numbered squares show the eight FCUs.</p>
<svg id="plan" viewBox="0 0 1680 1110" role="img" aria-label="Tap your place on the room plan"><g id="floor-plan"></g><circle id="marker" r="25" fill="#cc6d48" stroke="white" stroke-width="8" style="display:none"/></svg>
<strong id="position-label">Choose a point</strong></section><p id="status" role="status"></p>
<div class="phone-actions"><button id="save" disabled>Save preferences</button><button id="export">Export preferences</button></div><button id="leave" disabled>Leave room</button>
</main><script src="/client.js"></script></body></html>
